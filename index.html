<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111a2a">
  <meta name="description" content="一款关于重生、校园遗憾与命运选择的手机剧情游戏。">
  <title>回到她转学前的30天</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23131b2c'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23f4bf75' stroke-width='4'/%3E%3Cpath d='M32 19v14l9 6M22 14l-7 2 3 6' fill='none' stroke='%23f4bf75' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--ink:#f8f2e8;--muted:#bbc1ce;--line:rgba(255,255,255,.15);--panel:rgba(15,22,35,.82);--amber:#f1b967;--amber2:#ffd59a;--navy:#101827;--danger:#dc8e83}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0d1421;color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    button{font:inherit}
    body{min-height:100svh;overflow-x:hidden}
    .scene{position:fixed;inset:0;background-image:linear-gradient(180deg,rgba(7,12,21,.04),rgba(7,12,21,.32) 52%,rgba(7,12,21,.92)),url("assets/cover.webp");background-position:center;background-size:cover;background-repeat:no-repeat;transition:filter .7s ease,transform 1.1s ease,opacity .28s ease;transform:scale(1.015)}
    .scene::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(243,178,96,.13),transparent 36%),linear-gradient(90deg,rgba(8,12,19,.2),transparent 40%,rgba(8,12,19,.15))}
    .app{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom))}
    .phone{width:min(100%,520px);min-height:min(820px,calc(100svh - 36px));display:flex;flex-direction:column}
    .glass{background:linear-gradient(180deg,rgba(15,23,38,.75),rgba(9,15,26,.91));border:1px solid var(--line);box-shadow:0 28px 80px rgba(0,0,0,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px}
    .start{min-height:inherit;padding:32px 26px 26px;display:flex;flex-direction:column;justify-content:flex-end;animation:rise .7s ease both;background:linear-gradient(180deg,rgba(10,16,28,.03) 15%,rgba(10,16,28,.45) 54%,rgba(9,15,26,.94) 78%)}
    .eyebrow{font-size:.78rem;letter-spacing:.28em;color:var(--amber2);font-weight:700;margin-bottom:12px}
    h1{font-family:"Songti SC","STSong",serif;font-size:clamp(2.3rem,10vw,4.2rem);font-weight:700;line-height:1.08;letter-spacing:.02em;margin:0;text-shadow:0 4px 28px rgba(0,0,0,.45)}
    .lead{font-size:1rem;line-height:1.85;color:#e6e2dc;margin:22px 0 26px;max-width:28rem}
    .quote{border-left:2px solid var(--amber);padding-left:14px;color:var(--amber2);margin:0 0 28px;font-family:"Songti SC","STSong",serif;font-size:1.05rem;line-height:1.75}
    .primary,.choice,.ghost{border:0;cursor:pointer;touch-action:manipulation}
    .primary{width:100%;min-height:56px;border-radius:17px;background:linear-gradient(135deg,#f8cf91,#e8a956);color:#211608;font-weight:800;letter-spacing:.08em;box-shadow:0 9px 26px rgba(225,155,66,.25);transition:transform .15s ease,filter .15s ease}
    .primary:active,.choice:active{transform:scale(.985)}
    .primary:focus-visible,.choice:focus-visible,.ghost:focus-visible{outline:3px solid rgba(255,213,154,.7);outline-offset:3px}
    .game{min-height:inherit;display:flex;flex-direction:column;padding:16px 18px 18px;animation:fade .45s ease both}
    .hud{padding:4px 3px 12px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
    .hud-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .chapter{font-size:.79rem;color:var(--amber2);letter-spacing:.12em;font-weight:700}
    .counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
    .progress{height:3px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-bottom:14px}
    .progress span{display:block;height:100%;width:5%;background:linear-gradient(90deg,var(--amber),#ffe4b7);transition:width .45s ease}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .stat{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 7px;text-align:center}
    .stat b{display:block;font-size:.94rem;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
    .stat small{font-size:.72rem;color:var(--muted)}
    .story{margin-top:auto;display:flex;flex-direction:column;padding:22px 20px 18px;min-height:390px;max-height:66svh;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,rgba(14,21,34,.48),rgba(8,14,24,.62));border-color:rgba(255,255,255,.2);box-shadow:0 18px 52px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(11px) saturate(1.08);-webkit-backdrop-filter:blur(11px) saturate(1.08)}
    .time{font-size:.76rem;color:var(--amber2);letter-spacing:.08em;margin-bottom:12px}
    h2{font-family:"Songti SC","STSong",serif;font-size:1.55rem;line-height:1.35;margin:0 0 17px}
    .copy{font-size:1rem;line-height:1.9;color:#f4f1ec;white-space:pre-line;margin:0 0 22px;animation:textIn .42s ease both;text-shadow:0 1px 8px rgba(0,0,0,.72)}
    .beat-dots{display:flex;gap:6px;margin:-5px 0 15px}
    .beat-dots i{width:18px;height:3px;border-radius:9px;background:rgba(255,255,255,.16)}
    .beat-dots i.on{background:var(--amber)}
    .rewind{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.16);background:rgba(9,15,25,.52);color:#e7e1d9;border-radius:99px;padding:7px 11px;cursor:pointer;font-size:.8rem;backdrop-filter:blur(10px)}
    .rewind[disabled]{opacity:.35;cursor:not-allowed}
    .continue{margin-top:auto}
    .choices{margin-top:auto;display:grid;gap:10px}
    .choice{position:relative;text-align:left;padding:14px 45px 14px 15px;min-height:54px;border-radius:15px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);line-height:1.55;transition:background .18s ease,border-color .18s ease,transform .15s ease;animation:rise .4s ease both}
    .choice:nth-child(2){animation-delay:.05s}.choice:nth-child(3){animation-delay:.1s}
    .choice:hover{background:rgba(255,190,105,.11);border-color:rgba(255,205,137,.48)}
    .choice:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.4)}
    .choice:disabled::after{content:"锁";font-size:.74rem;color:var(--muted)}
    .choice::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-52%);font-size:1.55rem;color:var(--amber)}
    .effect{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);z-index:10;max-width:calc(100% - 32px);padding:11px 16px;border-radius:99px;background:rgba(11,18,30,.92);border:1px solid rgba(255,206,139,.42);box-shadow:0 8px 30px rgba(0,0,0,.35);color:var(--amber2);font-size:.84rem;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;white-space:nowrap}
    .effect.show{opacity:1;transform:translate(-50%,8px)}
    .ending{min-height:inherit;padding:30px 24px 24px;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .7s ease both}
    .ending-mark{font-size:.78rem;letter-spacing:.22em;color:var(--amber2);font-weight:700;margin-bottom:10px}
    .ending h2{font-size:2.4rem;margin-bottom:18px}
    .ending .copy{color:#f0ece6}
    .result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:4px 0 22px}
    .result-stats div{text-align:center;padding:10px 4px;background:rgba(255,255,255,.06);border-radius:12px;color:var(--muted);font-size:.72rem}
    .result-stats b{display:block;color:#fff;font-size:1rem;margin-top:3px}
    .ghost{margin-top:11px;width:100%;min-height:48px;background:transparent;color:var(--muted);border-radius:14px}
    .hidden{display:none!important}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes textIn{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media(max-width:560px){.app{padding:0}.phone{width:100%;min-height:100svh}.glass{border-radius:0;border-left:0;border-right:0}.start,.game,.ending{min-height:100svh}.story{border-radius:24px 24px 0 0;min-height:45svh;max-height:65svh;margin-left:-12px;margin-right:-12px;margin-bottom:-12px;padding:20px 20px max(18px,env(safe-area-inset-bottom))}.game{padding:74px 12px 12px}.stats{gap:5px}.stat{padding:7px 4px}.copy{font-size:1rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <main class="app">
    <div class="phone">
      <section class="start glass" id="startScreen">
        <div class="eyebrow">一场迟到了十年的重逢</div>
        <h1>回到她转学前的30天</h1>
        <p class="lead">前世，高考前的最后一个月，她突然转学，从此杳无音讯。多年后你才知道，她离开前最后拨出的电话，是打给你的。</p>
        <p class="quote">“如果那天我接了电话，一切会不会不一样？”</p>
        <button class="primary" id="startButton">回到那一天</button>
      </section>

      <section class="game hidden" id="gameScreen">
        <header class="hud">
          <div class="hud-top"><span class="chapter" id="chapter">第一章 · 重逢</span><span class="counter" id="counter">01 / 20</span></div>
          <div class="progress"><span id="progressBar"></span></div>
          <div class="stats" aria-label="当前属性">
            <div class="stat"><small>学业</small><b id="study">40</b></div>
            <div class="stat"><small>勇气</small><b id="courage">30</b></div>
            <div class="stat"><small>羁绊</small><b id="bond">20</b></div>
            <div class="stat"><small>线索</small><b id="clue">0</b></div>
          </div>
          <div style="margin-top:9px"><button class="rewind" id="backButton" disabled aria-label="回溯上一步">↶ 回溯上一步</button></div>
        </header>
        <article class="story glass">
          <div class="time" id="time"></div>
          <h2 id="eventTitle"></h2>
          <div class="beat-dots" id="beatDots" aria-hidden="true"></div>
          <p class="copy" id="eventText"></p>
          <div class="choices" id="choices"></div>
          <button class="primary continue hidden" id="continueButton">继续</button>
        </article>
      </section>

      <section class="ending glass hidden" id="endingScreen">
        <div class="ending-mark">命运结局</div>
        <h2 id="endingTitle"></h2>
        <p class="copy" id="endingText"></p>
        <div class="result-stats" id="resultStats"></div>
        <button class="primary" id="restartButton">再重生一次</button>
        <button class="ghost" id="homeButton">返回标题</button>
      </section>
    </div>
  </main>
  <div class="effect" id="effect" role="status" aria-live="polite"></div>

  <script>
    const events = [
      {chapter:"第一章 · 重逢",time:"第30天 · 07:42",title:"她坐在你身旁",image:"assets/event-01.png",beats:[
        "蝉声从半开的窗户涌进来。你猛地抬头，鼻腔里不是医院消毒水的气味，而是粉笔灰、旧木桌和夏天晒热的校服。黑板右上角写着距离高考还有二百七十三天。\n\n你低头看向自己的手——没有输液针孔，也没有那枚戴了十年的旧戒指。",
        "班主任推开教室门，身后跟着一个抱着课本的女生。她的马尾束得很低，额前碎发被晨风轻轻吹动。\n\n『新学期重新排座。林晚，你就坐窗边那个空位。』\n\n这个名字像一颗石子，砸穿了十年的沉默。",
        "她走到你桌旁，校服袖口擦过堆高的习题册。你记得这一天，也记得三十天后她空掉的座位。\n\n林晚看着你，礼貌又疏离地问：『同学，这里有人吗？』\n\n前世的你只摇了摇头。这一次，你必须开口。"
      ],choices:[
        {text:"替她拉开椅子：『我一直在等你。』",e:{bond:8,courage:3},flag:"warmWelcome"},
        {text:"压住震惊，只点点头",e:{study:2,bond:3}},
        {text:"立刻问她是不是要转学",e:{clue:4,bond:-4},flag:"rushed"}
      ]},
      {chapter:"第一章 · 重逢",time:"第29天 · 午休",title:"抽屉里的纸角",image:"assets/event-02.png",beats:[
        "午休铃响后，教室很快空了。林晚抱起全班作业往办公室走，临出门前还回头确认了一眼自己的座位。那个细小的动作，让你无法移开视线。",
        "风从窗缝钻进来，她抽屉里的试卷轻轻翻动。一张对折的表格滑出半截，纸角压着鲜红的学校公章。\n\n你认得它。前世清理空座位时，你也看见过同样的纸——转学申请。",
        "走廊传来渐近的脚步声。只要伸手，你就能提前知道她准备去哪里；可十年前的你，从来没有得到过她允许你走进秘密的机会。\n\n你的指尖停在离纸张不到两厘米的地方。"
      ],choices:[
        {text:"不偷看，等她主动告诉你",e:{bond:6,courage:1},flag:"respected"},
        {text:"快速记下申请日期",e:{clue:8,bond:-2}},
        {text:"把纸推回去，当作没看见",e:{study:2}}
      ]},
      {chapter:"第一章 · 重逢",time:"第28天 · 数学课",title:"空白的答题卡",image:"assets/event-03.png",beats:[
        "第三节是数学。老师把一道圆锥曲线写满半块黑板，粉笔划过板面，发出令人牙酸的轻响。\n\n林晚的练习册却一片空白。她盯着窗外那棵梧桐，像在计算一个与你们都无关的倒计时。",
        "『林晚，你上来做。』\n\n全班的目光同时转向她。她站起身时膝盖碰到桌沿，发出一声闷响。你看见她握住粉笔的手微微发抖——这不是不会，而是一整夜都没有睡。",
        "老师开始不耐烦地敲讲台。你在草稿纸上迅速写出三个关键步骤；与此同时，举手替她回答也许能更快结束这场难堪。\n\n林晚背对全班，白色粉笔停在黑板前。"
      ],choices:[
        {text:"在草稿纸写下关键步骤递给她",e:{study:5,bond:6}},
        {text:"主动举手替她回答",e:{study:7,courage:4,bond:2}},
        {text:"课后问她是不是没有睡好",e:{bond:4,clue:3}}
      ]},
      {chapter:"第一章 · 重逢",time:"第27天 · 放学",title:"没有吃完的面包",image:"assets/event-04.png",beats:[
        "放学后值日，你在垃圾桶最上面看见一个透明面包袋。面包只缺了很小的一角，包装日期却是三天前。\n\n林晚正背对你整理书包，动作慢得像是在等教室里的其他人先离开。",
        "你忽然想起前世的细节：她那段时间总说食堂太挤，午休却一个人留在教室；运动会那天，她跑完八百米后脸色惨白。\n\n当年你以为她只是不合群。现在才明白，她是在省下每一块钱。",
        "『你还不走吗？』她察觉到你的目光，迅速把没有拉好的书包合上。里面露出一叠缴费通知。\n\n同情会刺伤她的自尊，但假装没看见，也许会让她继续饿下去。"
      ],choices:[
        {text:"说自己买多了，把另一份推给她",e:{bond:7}},
        {text:"直说你发现她最近缺钱",e:{clue:5,courage:3,bond:-2}},
        {text:"邀请她一起去食堂复习",e:{study:4,bond:5}}
      ]},
      {chapter:"第一章 · 重逢",time:"第26天 · 17:50",title:"走廊尽头的电话",image:"assets/event-05.png",beats:[
        "傍晚五点五十分，你在楼梯间听见压低的说话声。林晚站在下一层平台，手里握着一部屏幕裂开的旧手机。\n\n『妈，再等我一个月……至少让我参加完这次模拟考。』",
        "电话那边的女人声音疲惫而急促：『车票已经买了。你爸那些人找到学校怎么办？我们不能再拖。』\n\n林晚没有反驳，只把额头抵在冰冷的墙面。窗外的夕阳把她的影子拉得很长。",
        "脚下的感应灯忽然熄灭。黑暗里，你听见她极轻地吸了一下鼻子，然后若无其事地说：『知道了。』\n\n再往前一步，她就会发现你听见了全部；退回走廊，你仍可以给她保留体面。"
      ],choices:[
        {text:"先离开，稍后装作偶遇陪她回家",e:{bond:6,clue:3},flag:"gentle"},
        {text:"走过去告诉她：『你不用一个人扛。』",e:{courage:7,bond:7},flag:"standBy"},
        {text:"记下电话里提到的“南站”",e:{clue:9,bond:-1}}
      ]},
      {chapter:"第二章 · 靠近",time:"第24天 · 雨夜",title:"只有一把伞",image:"assets/event-06.png",beats:[
        "晚自习结束时，暴雨正好压过操场。排水沟很快漫出来，校门外的路灯在积水里碎成一片金色。\n\n同学们陆续被家长接走，林晚却一直站在门厅最里面。",
        "她每隔几分钟就看一眼那部旧手机，屏幕始终没有亮。你知道不会有人来——前世的这场雨后，她发了三天高烧，却没有请假。\n\n你撑开伞，雨声立刻在伞面上密集地炸开。",
        "『我坐公交，很快的。』她下意识拒绝。\n\n末班车站在两条街外，你手里只有一把不算大的伞。若是并肩走，任何人都看得出你在靠近她；若把伞留下，她又会独自消失在雨里。"
      ],choices:[
        {text:"把伞给她，自己淋雨回去",e:{bond:8,courage:2}},
        {text:"并肩走到公交站",e:{bond:7,clue:2},flag:"sharedUmbrella"},
        {text:"留下陪她做完一套卷子再走",e:{study:7,bond:4}}
      ]},
      {chapter:"第二章 · 靠近",time:"第22天 · 班主任办公室",title:"被压住的申请表",image:"assets/event-07.png",beats:[
        "你抱着作业走进办公室时，班主任正准备锁抽屉。那张转学申请被压在文件最下面，监护人签名已经齐全，只差学校最后盖章。\n\n『老师，她一定要走吗？』",
        "班主任沉默片刻，把眼镜摘下来擦了擦。『家里的决定，学校很难干涉。她母亲说得很急，好像还牵涉债务。』\n\n他说学校有困难补助，但必须由学生本人申请，还要监护人配合。",
        "申请截止就在三天后。直接拖住转学表，只能换来很短的时间；找到合法的帮助，才可能让她真正留下。\n\n门外忽然传来脚步声，你必须在林晚出现前作出决定。"
      ],choices:[
        {text:"询问学校是否能提供困难补助",e:{clue:8,courage:5},flag:"aidInfo"},
        {text:"请求老师暂时不要批准",e:{courage:7,bond:2}},
        {text:"默默记住监护人签字的日期",e:{clue:7,study:2}}

      const f=state.flags;let ending;
      const hidden=f.has("callPromise")&&f.has("answered")&&f.has("herChoice")&&f.has("memoryCard")&&f.has("freeChoice")&&state.bond>=78&&state.clue>=65&&state.courage>=62;
      if(hidden){ending={title:"原来你也记得",text:"手续被暂缓，债务骗局也终于进入调查。清晨的站台上，林晚忽然叫住你。\n\n『上一次，我也打过那通电话。』\n\n她说出了一个只有前世的你才知道的日期。你终于明白，这三十天里并不是只有你在拯救她——她也一直在等机会，改变你的命运。"};}
      else if(state.bond>=68&&state.clue>=55&&state.courage>=56&&(f.has("meeting")||f.has("safeEvidence")||f.has("motherPlan"))){ending={title:"改变的夏天",text:"转学申请最终被撤回。学校提供了临时帮助，母亲也决定让林晚完成高考。盛夏结束时，你们在录取通知书背面写下同一座城市的名字。\n\n命运没有被奇迹打败，而是被你们一次次没有退缩的选择改变。"};}
      else if((state.clue>=48&&state.courage<52)||(!f.has("answered")&&state.clue>=52)){ending={title:"迟到的勇气",text:"你拼出了事情的全貌，却在最重要的时刻犹豫了。赶到南站时，列车已经离开。长椅上只剩她托人留下的一封信：\n\n『谢谢你让我知道，我不是没人记得。』"};}
      else if(state.bond>=44||f.has("letter")){ending={title:"保持联系",text:"你没能改变她离开的决定，却终于接住了那通电话。此后的每个月，你们都会交换一封信。\n\n几年后，你在另一座城市的大学门口再次见到她。这一次，你们都没有从彼此的人生里消失。"};}
      else{ending={title:"一切照旧",text:"她还是在那个夜晚离开了。你知道得比前世更多，却依然没有真正走进她的世界。\n\n手机里，那通未接来电安静地停在那里。时间能够重来，但逃避不会自动变成勇气。"};}
      $("endingTitle").textContent=ending.title;$("endingText").textContent=ending.text;
      $("resultStats").innerHTML=[["学业",state.study],["勇气",state.courage],["羁绊",state.bond],["线索",state.clue]].map(([a,b])=>`<div>${a}<b>${b}</b></div>`).join("");
      show(els.ending);document.querySelector(".scene").style.filter=hidden?"saturate(1.15) brightness(1.08)":"saturate(.82)";
    }
    $("startButton").addEventListener("click",startGame);
    els.next.addEventListener("click",()=>{state.beat++;render();});
    els.back.addEventListener("click",goBack);
    $("restartButton").addEventListener("click",()=>{document.querySelector(".scene").style.filter="";startGame();});
    $("homeButton").addEventListener("click",()=>{els.scene.style.filter="";setScene("assets/cover.webp");show(els.start);});
  </script>
</body>
</html>
